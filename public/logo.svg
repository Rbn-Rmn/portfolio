<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>

    <!-- Palette -->
    <linearGradient id="gFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#22577a"/>
      <stop offset="35%"  stop-color="#38a3a5"/>
      <stop offset="70%"  stop-color="#57cc99"/>
      <stop offset="100%" stop-color="#c7f9cc"/>
    </linearGradient>

    <linearGradient id="gTealMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38a3a5"/>
      <stop offset="100%" stop-color="#57cc99"/>
    </linearGradient>

    <linearGradient id="gMintTea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#80ed99"/>
      <stop offset="100%" stop-color="#c7f9cc"/>
    </linearGradient>

    <linearGradient id="gBalticTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#22577a"/>
      <stop offset="100%" stop-color="#38a3a5"/>
    </linearGradient>

    <!-- DS shimmer -->
    <linearGradient id="gShimmer" x1="-100%" y1="0%" x2="200%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#38a3a5"/>
      <stop offset="30%"  stop-color="#c7f9cc"/>
      <stop offset="60%"  stop-color="#57cc99"/>
      <stop offset="100%" stop-color="#38a3a5"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-200 0" to="200 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Bar chart gradient — bottom to top -->
    <linearGradient id="gBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#22577a"/>
      <stop offset="100%" stop-color="#38a3a5"/>
    </linearGradient>
    <linearGradient id="gBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#38a3a5"/>
      <stop offset="100%" stop-color="#57cc99"/>
    </linearGradient>
    <linearGradient id="gBar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#57cc99"/>
      <stop offset="100%" stop-color="#80ed99"/>
    </linearGradient>
    <linearGradient id="gBar4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#80ed99"/>
      <stop offset="100%" stop-color="#c7f9cc"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="deepglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="barshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Hex clip -->
    <clipPath id="hexClip">
      <polygon points="100,8 180,52 180,148 100,192 20,148 20,52"/>
    </clipPath>

  </defs>

  <!-- ══════════════════════
       BACKGROUND
  ══════════════════════ -->
  <polygon points="100,8 180,52 180,148 100,192 20,148 20,52"
    fill="#071520"/>
  <polygon points="100,8 180,52 180,148 100,192 20,148 20,52"
    fill="#0a1e2e" opacity="0.9"/>

  <!-- Radial inner glow -->
  <radialGradient id="innerGlow" cx="50%" cy="50%" r="55%">
    <stop offset="0%"   stop-color="#38a3a5" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#071520" stop-opacity="0"/>
  </radialGradient>
  <polygon points="100,8 180,52 180,148 100,192 20,148 20,52"
    fill="url(#innerGlow)"/>

  <!-- Grid texture -->
  <g clip-path="url(#hexClip)" opacity="0.05">
    <line x1="20"  y1="0" x2="20"  y2="200" stroke="#38a3a5" stroke-width="0.7"/>
    <line x1="44"  y1="0" x2="44"  y2="200" stroke="#38a3a5" stroke-width="0.7"/>
    <line x1="68"  y1="0" x2="68"  y2="200" stroke="#38a3a5" stroke-width="0.7"/>
    <line x1="92"  y1="0" x2="92"  y2="200" stroke="#38a3a5" stroke-width="0.7"/>
    <line x1="116" y1="0" x2="116" y2="200" stroke="#38a3a5" stroke-width="0.7"/>
    <line x1="140" y1="0" x2="140" y2="200" stroke="#38a3a5" stroke-width="0.7"/>
    <line x1="164" y1="0" x2="164" y2="200" stroke="#38a3a5" stroke-width="0.7"/>
    <line x1="0" y1="44"  x2="200" y2="44"  stroke="#38a3a5" stroke-width="0.7"/>
    <line x1="0" y1="92"  x2="200" y2="92"  stroke="#38a3a5" stroke-width="0.7"/>
    <line x1="0" y1="140" x2="200" y2="140" stroke="#38a3a5" stroke-width="0.7"/>
  </g>

  <!-- ══════════════════════
       HEX BORDER
  ══════════════════════ -->
  <!-- Glow halo -->
  <polygon points="100,8 180,52 180,148 100,192 20,148 20,52"
    fill="none" stroke="url(#gFull)" stroke-width="6" opacity="0.12" filter="url(#deepglow)"/>

  <!-- Animated dashed border -->
  <polygon points="100,8 180,52 180,148 100,192 20,148 20,52"
    fill="none" stroke="url(#gFull)" stroke-width="2.5"
    stroke-dasharray="40 10" stroke-linecap="round" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="200" dur="6s" repeatCount="indefinite"/>
  </polygon>

  <!-- Thin inner border -->
  <polygon points="100,14 174,56 174,144 100,186 26,144 26,56"
    fill="none" stroke="url(#gTealMint)" stroke-width="1" opacity="0.22"/>

  <!-- ══════════════════════
       DS MONOGRAM — upper half
  ══════════════════════ -->

  <!-- Glow behind DS -->
  <text x="100" y="106"
    text-anchor="middle"
    font-family="'Syne','Arial Black',sans-serif"
    font-size="64" font-weight="900" letter-spacing="-2"
    fill="#38a3a5" opacity="0.13" filter="url(#deepglow)">DS</text>

  <!-- Main DS -->
  <text x="100" y="106"
    text-anchor="middle"
    font-family="'Syne','Arial Black',sans-serif"
    font-size="64" font-weight="900" letter-spacing="-2"
    fill="url(#gShimmer)" filter="url(#softglow)">DS</text>

  <!-- ══════════════════════
       DATA VIZ — bar chart below DS
       4 animated bars + baseline + line chart dot
  ══════════════════════ -->

  <!-- Baseline -->
  <line x1="60" y1="148" x2="140" y2="148"
    stroke="url(#gTealMint)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Bar 1 — Baltic/Teal — short -->
  <rect x="64" y="132" width="12" height="16" rx="3" fill="url(#gBar1)"
    filter="url(#barshadow)" opacity="0.95">
    <animate attributeName="height" values="16;10;20;16" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="y"      values="132;138;128;132" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Bar 2 — Teal/Mint — tallest -->
  <rect x="82" y="120" width="12" height="28" rx="3" fill="url(#gBar2)"
    filter="url(#barshadow)" opacity="0.95">
    <animate attributeName="height" values="28;36;22;28" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="y"      values="120;112;126;120" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Bar 3 — Mint/Green -->
  <rect x="100" y="126" width="12" height="22" rx="3" fill="url(#gBar3)"
    filter="url(#barshadow)" opacity="0.95">
    <animate attributeName="height" values="22;16;28;22" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y"      values="126;132;120;126" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Bar 4 — Green/Tea — medium -->
  <rect x="118" y="129" width="12" height="19" rx="3" fill="url(#gBar4)"
    filter="url(#barshadow)" opacity="0.95">
    <animate attributeName="height" values="19;26;14;19" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="y"      values="129;122;134;129" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Trend line over bars — data analysis feel -->
  <polyline points="70,134 88,122 106,128 124,131"
    fill="none" stroke="#c7f9cc" stroke-width="1.5"
    stroke-linecap="round" stroke-linejoin="round"
    opacity="0.7" filter="url(#softglow)"/>

  <!-- Trend line dots -->
  <circle cx="70"  cy="134" r="2.5" fill="#c7f9cc" filter="url(#softglow)" opacity="0.9"/>
  <circle cx="88"  cy="122" r="2.5" fill="#80ed99" filter="url(#softglow)" opacity="0.9"/>
  <circle cx="106" cy="128" r="2.5" fill="#57cc99" filter="url(#softglow)" opacity="0.9"/>
  <circle cx="124" cy="131" r="2.5" fill="#38a3a5" filter="url(#softglow)" opacity="0.9"/>

  <!-- Animated highlight dot traveling the trend line -->
  <circle r="3.2" fill="#c7f9cc" filter="url(#glow)" opacity="0.95">
    <animateMotion dur="2.5s" repeatCount="indefinite"
      path="M 70,134 L 88,122 L 106,128 L 124,131"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ══════════════════════
       HEX VERTEX DOTS
  ══════════════════════ -->
  <g filter="url(#glow)">
    <circle cx="100" cy="12"  r="4"   fill="#c7f9cc" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="188" r="4"   fill="#57cc99" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s"   begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="177" cy="54"  r="3.5" fill="#38a3a5" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="177" cy="146" r="3.5" fill="#57cc99" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="23"  cy="54"  r="3.5" fill="#38a3a5" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" begin="1s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="23"  cy="146" r="3.5" fill="#c7f9cc" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.1s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ══════════════════════
       SCAN LINE
  ══════════════════════ -->
  <rect x="22" y="99" width="156" height="1" fill="#57cc99" opacity="0"
    clip-path="url(#hexClip)">
    <animate attributeName="y"       values="22;178;22" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.1;0.1;0"
      keyTimes="0;0.05;0.92;1"      dur="5s" repeatCount="indefinite"/>
  </rect>

</svg>
